# Publishes the browser version of Calibro to GitHub Pages.
# Runs on every push to the "main" branch, or manually from the Actions tab.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: |
          wget -qO- "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xzf - -C /usr/local/bin
          trunk --version
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: app
        # The site lives at https://<user>.github.io/<repository>/ so assets need that prefix.
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
