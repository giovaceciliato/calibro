<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Calibro — 3D CAD in your browser</title>
    <meta name="description" content="Calibro: an open-source precision 3D CAD application written in Rust." />
    <link data-trunk rel="rust" data-wasm-opt="z" data-bin="calibro" />
    <link data-trunk rel="icon" href="../assets/favicon.svg" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #e9ebef; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #loading {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px;
            font: 15px system-ui, sans-serif; color: #333;
        }
        #loading strong { color: #ff8c1a; font-size: 22px; }
    </style>
</head>
<body>
    <canvas id="calibro_canvas"></canvas>
    <div id="loading">
        <strong>Calibro</strong>
        <span>Loading the CAD engine…</span>
        <noscript>Calibro needs JavaScript and WebAssembly.</noscript>
    </div>
</body>
</html>
