# Runs automatically on every push and pull request.
# It checks formatting, lints, runs all tests (including GPU rendering tests on a
# software GPU), and makes sure the browser (WebAssembly) build compiles.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Software GPU for rendering tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json

  web:
    name: Browser build (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build for the browser
        run: cargo build -p calibro --target wasm32-unknown-unknown --release
